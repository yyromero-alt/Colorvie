<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colorvie · Información nutricional</title>
<style>
  :root { --c:#E6277F; --fondo:#FDE3EE; }
  * { box-sizing: border-box; }
  html { background:var(--fondo); }
  body { margin:0; min-height:100vh; background:transparent; position:relative; color:#3a3a3a;
         font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif; transition:background .3s;
         display:flex; flex-direction:column; align-items:center; padding:16px 12px 28px; gap:12px; }
  /* Fondo difuminado: manchas suaves del color del sabor */
  body::before { content:""; position:fixed; inset:-10%; z-index:-1; pointer-events:none;
         background:
           radial-gradient(circle at 12% 8%,  color-mix(in srgb, var(--c) 55%, transparent) 0, transparent 42%),
           radial-gradient(circle at 90% 18%, color-mix(in srgb, var(--c) 28%, #fff) 0, transparent 40%),
           radial-gradient(circle at 78% 92%, color-mix(in srgb, var(--c) 50%, transparent) 0, transparent 46%),
           radial-gradient(circle at 8% 88%,  color-mix(in srgb, var(--c) 18%, #fff) 0, transparent 42%),
           radial-gradient(circle at 50% 50%, #ffffffaa 0, transparent 60%);
         filter:blur(28px); animation:flota 14s ease-in-out infinite alternate; }
  @keyframes flota { from { transform:translate(0,0) scale(1); } to { transform:translate(-2%,2%) scale(1.06); } }
  .logo { mix-blend-mode:multiply; height:130px; filter:drop-shadow(0 4px 10px rgba(255,255,255,.8)); max-width:100%; object-fit:contain; }
  .sabores { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .sabores button { border:2px solid var(--c); background:#fff; color:var(--c); font:inherit; font-weight:700;
         padding:7px 14px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .sabores button i { width:14px; height:14px; border-radius:50%; display:inline-block; }
  .sabores button.activo { background:var(--c); color:#fff; }
  .tarjeta { background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-radius:22px; padding:20px 22px 16px; width:100%; max-width:420px;
         box-shadow:0 6px 22px rgba(0,0,0,.08); }
  .tarjeta h1 { margin:0 0 10px; text-align:center; color:var(--c); font-size:26px; }
  .tabla { border:2px solid var(--c); padding:8px 10px; color:var(--c); }
  .tabla h2 { margin:0 0 4px; text-align:center; font-size:21px; }
  .tabla p { margin:2px 0; font-size:14px; }
  .colageno { display:flex; justify-content:space-between; align-items:center; margin:6px 0 !important; padding:6px 10px;
         background:var(--c); color:#fff; border-radius:8px; font-size:16px !important; font-weight:700; }
  .colageno b { font-size:19px; }
  .linea { border:0; border-top:4px solid var(--c); margin:6px 0; }
  .linea.fina { border-top-width:2px; }
  .energia { font-size:17px; margin:4px 0; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th { text-align:right; font-size:12px; padding:2px 0; }
  td { padding:4px 0; }
  td:nth-child(2), td:nth-child(3) { text-align:right; width:62px; }
  tr.sub td:first-child { padding-left:14px; }
  tr.fila td { border-top:1px solid color-mix(in srgb, var(--c) 35%, #fff); }
  .nota { font-size:11px; margin-top:8px; color:var(--c); }
  .pedido { background:rgba(255,255,255,.9); backdrop-filter:blur(10px); border-radius:22px; width:100%; max-width:420px; overflow:hidden; box-shadow:0 6px 22px rgba(0,0,0,.08); }
  .pedido header { background:var(--c); color:#fff; padding:12px 18px; }
  .pedido header h2 { margin:0; font-size:21px; }
  .pedido header p { margin:2px 0 0; font-size:13px; opacity:.95; }
  .pedido .cuerpo { padding:12px 18px 18px; display:flex; flex-direction:column; gap:8px; }
  .item { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #eee; }
  .item i { width:14px; height:14px; border-radius:50%; flex:none; }
  .item .n { flex:1; font-weight:700; font-size:15px; }
  .item .n small { display:block; font-weight:400; color:#888; font-size:12px; }
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button { width:32px; height:32px; border-radius:50%; border:2px solid var(--c); background:#fff; color:var(--c);
         font-size:18px; font-weight:700; cursor:pointer; line-height:1; }
  .qty span { min-width:20px; text-align:center; font-weight:700; }
  .pedido input, .pedido textarea { width:100%; border:1.5px solid #ddd; border-radius:10px; padding:9px 11px; font:inherit; font-size:14px; }
  .pedido input:focus, .pedido textarea:focus { outline:none; border-color:var(--c); }
  .resumen { display:flex; justify-content:space-between; font-size:14px; color:#666; padding:2px 0; }
  .total { display:flex; justify-content:space-between; font-weight:700; font-size:16px; }
  .wa { background:#25D366; color:#fff; border:0; border-radius:12px; padding:13px; font:inherit; font-weight:700; font-size:16px;
        cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .wa:disabled { background:#b9e8cb; cursor:not-allowed; }
  .wa svg { width:22px; height:22px; fill:#fff; }
  .zona { background:var(--fondo); color:var(--c); border-radius:10px; padding:8px 11px; font-size:13px; font-weight:700; text-align:center; }
  .pedido select { width:100%; border:1.5px solid #ddd; border-radius:10px; padding:9px 11px; font:inherit; font-size:14px; background:#fff; }
  .aviso { font-size:12px; color:#888; text-align:center; margin:0; }
  .pie { font-size:12px; color:#777; text-align:center; }
</style>
</head>
<body>

<img class="logo" id="logo" alt="Colorvie">
<div class="sabores" id="sabores"></div>
<div class="tarjeta">
  <h1 id="nombre"></h1>
  <div class="tabla">
    <h2>Información nutricional</h2>
    <p id="porcion"></p>
    <p id="porciones"></p>
    <hr class="linea">
    <p class="energia" id="energia"></p>
    <p class="colageno"><span>Colágeno</span><b id="colageno"></b></p>
    <hr class="linea">
    <table>
      <thead><tr><th></th><th></th><th>% VD*</th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
    <hr class="linea fina">
    <p class="nota" id="nota"></p>
  </div>
</div>
<div class="pedido" id="pedido">
  <header>
    <h2>🍦 Haz tu pedido aquí</h2>
    <p>Elige tus sabores y envíanos el pedido por WhatsApp</p>
  </header>
  <div class="cuerpo">
    <div class="zona" id="zona"></div>
    <div id="items"></div>
    <div id="totalBox" hidden>
      <div class="resumen"><span>Helados</span><span id="subtotal"></span></div>
      <div class="resumen" id="envioFila"><span>Envío</span><span id="envio"></span></div>
      <div class="total"><span>Total</span><span id="total"></span></div>
    </div>
    <input id="cliente" placeholder="Tu nombre">
    <select id="municipio" onchange="pintarPedido()"></select>
    <textarea id="notas" rows="2" placeholder="Dirección y barrio / notas del pedido"></textarea>
    <button class="wa" id="btnWa" onclick="enviarPedido()" disabled>
      <svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.3 8.7 3.3 15.7c0 2.3.6 4.4 1.7 6.3L3 29l7.2-1.9c1.8 1 3.8 1.5 5.8 1.5 7 0 12.7-5.7 12.7-12.7S23 3 16 3zm0 23.1c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-4.3 1.1 1.2-4.2-.3-.4a10.4 10.4 0 1 1 8.9 5.1zm5.7-7.8c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.500 8.500 0 0 1-4.200-3.700c-.3-.6.3-.5.9-1.700.1-.2 0-.4 0-.5l-.9-2.200c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.500 1.100 2.900 1.200 3.100 2.100 3.300 5.200 4.600c1.900.8 2.700.9 3.600.7.600-.1 1.800-.7 2-1.400s.3-1.300.2-1.400-.3-.2-.6-.3z"/></svg>
      Pedir por WhatsApp
    </button>
    <p class="aviso">Elige tu municipio para activar el botón. Se abrirá WhatsApp con tu pedido listo para enviar.</p>
  </div>
</div>
<div class="pie" id="pie"></div>

const $ = id => document.getElementById(id);

function mostrar(i) {
  const p = PRODUCTOS[i];
  document.documentElement.style.setProperty("--c", p.color);
  document.documentElement.style.setProperty("--fondo", p.fondo);
  $("logo").src = p.logo;
  $("nombre").textContent = p.nombre;
  $("porcion").textContent = "Tamaño de la porción: " + p.porcion;
  $("porciones").textContent = "Porciones por envase: " + p.porciones;
  $("energia").textContent = "Energía: " + p.energia;
  $("colageno").textContent = p.colageno;
  $("nota").textContent = NOTA;
  $("filas").innerHTML = p.filas.map(f =>
    `<tr class="fila ${f.sub ? "sub" : ""}"><td>${f.nombre}</td><td>${f.valor}</td><td>${f.vd}</td></tr>`
  ).join("");
  [...$("sabores").children].forEach((b, n) => b.classList.toggle("activo", n === i));
}

$("sabores").innerHTML = PRODUCTOS.map((p, i) =>
  `<button onclick="mostrar(${i})"><i style="background:${p.color}"></i>${p.nombre}</button>`
).join("");
$("pie").textContent = PIE;
document.title = MARCA + " · Información nutricional";
mostrar(0);   // al entrar muestra el primer producto de la lista

/* ---------------- Pedido por WhatsApp ---------------- */
const cant = PRODUCTOS.map(() => 0);
const fmt = n => new Intl.NumberFormat("es-CO", { style:"currency", currency:"COP", maximumFractionDigits:0 }).format(n);

function cambiar(i, d) { cant[i] = Math.max(0, cant[i] + d); pintarPedido(); }

function pintarPedido() {
  $("items").innerHTML = PRODUCTOS.map((p, i) =>
    `<div class="item"><i style="background:${p.color}"></i>
       <div class="n">${p.nombre}${p.precio ? `<small>${fmt(p.precio)} c/u</small>` : ""}</div>
       <div class="qty"><button onclick="cambiar(${i},-1)" aria-label="Quitar">−</button><span>${cant[i]}</span><button onclick="cambiar(${i},1)" aria-label="Agregar">+</button></div>
     </div>`).join("");
  const sub = PRODUCTOS.reduce((t, p, i) => t + p.precio * cant[i], 0);
  $("totalBox").hidden = sub === 0;
  $("subtotal").textContent = fmt(sub);
  $("envioFila").hidden = !ENVIO;
  $("envio").textContent = fmt(ENVIO);
  $("total").textContent = fmt(sub + ENVIO);
  $("btnWa").disabled = cant.every(c => c === 0) || !$("municipio").value;
}

function enviarPedido() {
  const lineas = PRODUCTOS.map((p, i) => cant[i] ? `• ${cant[i]} x ${p.nombre}` : null).filter(Boolean);
  const sub = PRODUCTOS.reduce((t, p, i) => t + p.precio * cant[i], 0);
  let msg = SALUDO + "\n" + lineas.join("\n");
  if (sub) {
    msg += "\nHelados: " + fmt(sub);
    if (ENVIO) msg += "\nEnvío: " + fmt(ENVIO);
    msg += "\nTotal: " + fmt(sub + ENVIO);
  }
  msg += "\nMunicipio: " + $("municipio").value + ", Cundinamarca";
  if ($("cliente").value.trim()) msg += "\nNombre: " + $("cliente").value.trim();
  if ($("notas").value.trim())   msg += "\nDirección/Notas: " + $("notas").value.trim();
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank");
}
$("zona").textContent = "📍 Envíos únicamente a " + MUNICIPIOS.join(" y ") + ", Cundinamarca";
$("municipio").innerHTML = '<option value="">Selecciona tu municipio</option>' + MUNICIPIOS.map(m => `<option>${m}</option>`).join("");
pintarPedido();

</script>
